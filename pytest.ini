[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=openmux --cov-report=term-missing
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    server: marks tests as server-related
    client: marks tests as client-related
    management: marks tests as management-related
    slow: marks tests as slow (skipped by default)
    e2e: marks tests that run the real server process (tests/e2e, needs --run-e2e)
    e2e_browser: marks an e2e test that drives a browser (skipped when Chromium is missing)
    e2e_surfaces: names the surfaces an e2e test observes, for docs/E2E_TESTS.md
asyncio_default_fixture_loop_scope = function
