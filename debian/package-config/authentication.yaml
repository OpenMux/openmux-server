external_auth:
  allow_root: false
  enabled: false
  groups:
    admin_group: openmux_admin
    read_group: openmux_read
    write_group: openmux_write
  service: openmux
  timeout: 10
# `users[].password_hash` must be a SHA-256 hex digest of the plaintext password.
# Example generation commands:
#   python3 -c 'import hashlib; print(hashlib.sha256("your-password".encode()).hexdigest())'
#   printf '%s' 'your-password' | sha256sum | awk '{print $1}'
users:
- permissions: admin
  password_hash: CHANGE_ME_ON_FIRST_BOOT
  username: admin