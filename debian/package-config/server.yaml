# OpenMux Server Configuration (Debian package defaults)
#
# This file holds server policy only. Filesystem locations are owned by the
# systemd unit + /etc/defaults/openmux (see openmux-server.service):
# OPENMUX_LOG_DIR, OPENMUX_RUN_DIR, OPENMUX_STATE_DIR. Web UI assets come
# from the installed python package; TLS state from OPENMUX_STATE_DIR.

server:
  id: "primary-server"
  description: "Primary OpenMux Server"

loopback_ports:
  - name: "loopback"
    description: "Loopback Test Console"
    echo_delay: 0.0
    buffer_size: 1024
    max_read_write_users: 5

serial_ports:
  - name: "console1"
    description: "Main Server Console"
    device: "/dev/ttyS0"
    baudrate: 9600
    bytesize: 8
    parity: "N"
    stopbits: 1
    read_write_users: 5

logging:
  level: "INFO"
  file: "/var/log/openmux/openmux_server.log"
  console: true

client_listener:
  host: "127.0.0.1"
  port: 8023
  max_connections: 200
  connection_timeout: 30

web_console:
  enable_probes: true
  enable_ui: true
  host: 0.0.0.0
  plugins:
  - openmux.server.web_plugins.config_editor
  port: 80
  probes_include_details: true
  realm: OpenMux
  respect_forwarded_prefix: false
  ssl_port: 443
  tls_autogen: true
  use_tls: true

port_actions:
  # Writable, user-managed home for port-action scripts (created by the
  # package; the Config Editor creates action directories here).
  actions_dir: /etc/openmux/actions