"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://openmux.org/schema/client-config"
title: OpenMux Client Configuration Schema
description: >
  Validates the OpenMux client configuration (client.yaml, openmux_client.yaml,
  or dotfile variants). The client shallow-merges this file over its built-in
  defaults, so all keys are optional.
type: object
additionalProperties: false
properties:
  default_server:
    type: string
    default: null
    description: "Name or host of the preferred server entry (first entry if unset)."
  servers:
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 8023 }
        username: { type: string }
        password: { type: string }
        api_key: { type: string }
        pubkey_path: { type: string }
        pubkey_id: { type: string }
  use_tls: { type: boolean, default: false }
