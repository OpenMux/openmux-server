# OpenMux server default configuration (single source of truth).
#
# This directory (config/) holds the *pristine* defaults. For local
# development, run `make init-config`: it copies server.yaml,
# authentication.yaml, and security.yaml into the gitignored config-local/
# and `make run-server` then runs `--config-dir config-local`. Edit the
# LOCAL copy (config-local/ or /etc/openmux/ in a packaged install), not
# this file.
#
# The Debian package ships this set as its default too: debian/rules
# generates the packaged server.yaml from this file with only the FHS
# overrides applied (logging.file, port_actions.actions_dir). The packaged
# authentication.yaml is intentionally different and stays in
# debian/package-config/ (no local automation API keys).
#
# Keep this file free of secrets; it ships in the Debian package.

server:
  id: "primary-server"
  description: "Primary OpenMux Server"

# Per-subtype top-level configuration

loopback_ports:
  - name: "loopback"
    description: "Loopback Test Console"
    echo_delay: 0.0
    buffer_size: 1024
    max_read_write_users: multiple
    # Optional per-port data log file; defaults to logs/ports/<name>.log if omitted
    # log_file: "logs/ports/loopback.jsonl"
    # To log only outbound data uncomment:
    # log_direction: out
    # PDU power feeds (optional): `<pdu_name>.<outlet_id>` refs for the outlets
    # this console is powered by. Multiple entries = A/B dual feed. See the
    # `power:` section below and docs/configuration/adapters.md.
    power: ["rack1.3", "phaseA.A1"]

serial_ports:
  - name: "console1"
    description: "Main Server Console"
    device: "/dev/ttyS0"
    baudrate: 9600
    bytesize: 8
    parity: "N"
    stopbits: 1
    max_read_write_users: multiple
  
    # log_file: "logs/ports/console1.jsonl"
    # log_directions: [in, out]

## Note: the deprecated `openmux_client_ports` top-level section is fully removed
## (ticket #72); use `tcp_initiator_ports` with `protocol: {type: openmux}`.

logging:
  level: "INFO"
  file: "logs/openmux_server.log"
  console: true

# TCP console endpoint (required for clients to connect)
client_listener:
  host: "127.0.0.1"
  port: 8023
  max_connections: 200
  connection_timeout: 30

# PDU power control (optional): manages outlets (on/off + watts/volts/amps)
# behind a driver interface; the dummy driver simulates the device in memory. Real
# drivers (e.g. Raritan, APC) plug in via `driver:` with no other changes. Outlet
# ids are the device's OWN ids (free strings: "1", "A1", "C2", ...). The console
# side maps a port to its feeds with `power: [refs]` on port entries.
power:
  enabled: true
  pdus:
    - name: "rack1"            # unique PDU name (no dots/whitespace; prefixes refs)
      description: "Rack 1 PDU"
      driver: dummy
      poll_interval: 30        # PER-PDU seconds; 0 = no poll task (on-demand reads)
      options:
        outlets: ["1", "2", "3", "4", "5", "6", "7", "8"]
      outlets:                 # optional per-outlet annotations, keyed by id
        - id: "3"
          description: "Switch A"
    - name: "phaseA"           # 3-phase-style example: string outlet ids
      description: "Phase A PDU"
      driver: dummy
      poll_interval: 10
      options:
        outlets: ["A1", "B1", "C2"]
        watts_on: 55
      outlets:
        - id: "A1"
          description: "Phase A primary"

# Web console with Config Editor plugin enabled
web_console:
  enable_probes: true
  enable_ui: true
  # Loopback by default: the console is reachable from the local host only.
  # To serve it to other hosts, set host: 0.0.0.0 (config file or web console
  # Config Editor > Server > web_console.host). See docs/QUICKSTART.md.
  host: 127.0.0.1
  plugins:
  - openmux.server.web_plugins.config_editor
  - openmux.server.web_plugins.power_monitor
  port: 80
  probes_include_details: true
  respect_forwarded_prefix: false
  ssl_port: 443
  tls_autogen: true
  use_tls: true