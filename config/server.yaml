# OpenMux server default configuration (single source of truth).
#
# This directory (config/) holds the *pristine* defaults. For local
# development, run `make init-config`: it copies server.yaml,
# authentication.yaml, and security.yaml into the gitignored config-local/
# and `make run-server` then runs `--config-dir config-local`. Edit the
# LOCAL copy (config-local/ or /etc/openmux/ in a packaged install), not
# this file.
#
# The Debian package ships this set as its default too: debian/rules
# generates the packaged server.yaml from this file with only the FHS
# overrides applied (logging.file, port_actions.actions_dir). The packaged
# authentication.yaml is intentionally different and stays in
# debian/package-config/ (no local automation API keys).
#
# Keep this file free of secrets; it ships in the Debian package.

server:
  id: "primary-server"
  description: "Primary OpenMux Server"

# Per-subtype top-level configuration

loopback_ports:
  - name: "loopback"
    description: "Loopback Test Console"
    echo_delay: 0.0
    buffer_size: 1024
    max_read_write_users: multiple
    # Optional per-port data log file; defaults to logs/ports/<name>.log if omitted
    # log_file: "logs/ports/loopback.jsonl"
    # To log only outbound data uncomment:
    # log_direction: out

serial_ports:
  - name: "console1"
    description: "Main Server Console"
    device: "/dev/ttyS0"
    baudrate: 9600
    bytesize: 8
    parity: "N"
    stopbits: 1
    max_read_write_users: multiple
  
    # log_file: "logs/ports/console1.jsonl"
    # log_directions: [in, out]

## Note: unified schema no longer supports `openmux_client_ports` top-level entries.

logging:
  level: "INFO"
  file: "logs/openmux_server.log"
  console: true

# TCP console endpoint (required for clients to connect)
client_listener:
  host: "127.0.0.1"
  port: 8023
  max_connections: 200
  connection_timeout: 30

# Web console with Config Editor plugin enabled
web_console:
  enable_probes: true
  enable_ui: true
  host: 0.0.0.0
  plugins:
  - openmux.server.web_plugins.config_editor
  port: 80
  probes_include_details: true
  realm: OpenMux
  respect_forwarded_prefix: false
  ssl_port: 443
  tls_autogen: true
  use_tls: true