"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://openmux.org/schema/client-config"
title: OpenMux Client Configuration Schema
description: >
  Validates the OpenMux client configuration (client.yaml, openmux_client.yaml,
  or dotfile variants). The client shallow-merges this file over its built-in
  defaults, so all keys are optional.
type: object
additionalProperties: false
properties:
  default_server:
    type: string
    default: null
    description: "Name or host of the preferred server entry (first entry if unset)."
  servers:
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 8023 }
        username: { type: string }
        password: { type: string }
        api_key: { type: string }
        pubkey_path: { type: string }
        pubkey_id: { type: string }
  use_tls: { type: boolean, default: false }
  logging:
    type: object
    additionalProperties: false
    description: >
      Optional client logging configuration, consumed by ClientLoggingManager.
      All keys are optional; defaults apply when omitted.
    properties:
      log_level:
        description: "Log level for the root logger. One of DEBUG, INFO, WARNING, ERROR, CRITICAL. Default WARNING."
      file_only:
        type: boolean
        default: false
        description: "Log to file only; suppress the console handler."
      file_logging_enabled:
        type: boolean
        default: false
        description: "Write log records to a file in addition to the console."
      log_dir:
        type: string
        default: logs
        description: "Directory for the client log file. Default logs."
      log_file:
        type: string
        default: openmux_client.log
        description: "Basename of the client log file. Default openmux_client.log."
      log_max_size_mb:
        type: integer
        minimum: 0
        default: 10
        description: "Rotation threshold in MB for the client log. 0 disables rotation. Default 10."
      log_backups:
        type: integer
        minimum: 0
        default: 5
        description: "Number of rotated client log backups to keep. 0 disables rotation. Default 5."
