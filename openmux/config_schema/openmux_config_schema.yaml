"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://openmux.org/schema/server-config"
title: OpenMux Server Configuration Schema
description: >
  Validates the core OpenMux server configuration (server.yaml).
  Authentication credentials live in authentication.yaml (see
  openmux_authentication_schema.yaml) and are not part of server.yaml.
type: object
required: [server]
additionalProperties: false
properties:
  server:
    type: object
    additionalProperties: false
    properties:
      # Sole identity key: used for the federation handshake ID, the MuxCon
      # and web-console autogen cert CN, the SSO node claim, and the command
      # port banner. Falls back to the system hostname when absent
      # (shared resolver: openmux/common/identity.py). `name` and
      # `server_id` are removed (ticket #74); use `description` for a
      # free-form label.
      id: { type: string }
      description: { type: string }
      fail_fast_adapters: { type: boolean, default: true }
  logging:
    type: object
    additionalProperties: false
    properties:
      level:
        type: string
        description: "Log level for the root and openmux.* loggers. Hot-applies on SIGHUP/soft reload."
      console:
        type: boolean
        description: "Mirror log records to stdout. Default true."
      file:
        type: string
        description: "Full path of the main aggregate server log. Default {log_dir}/openmux.log. Takes effect on SIGHUP/soft or full reload."
      max_log_size:
        type: integer
        minimum: 0
        description: "Rotation threshold in bytes for every rotating log file. Default 10485760 (10 MB)."
      log_backup_count:
        type: integer
        minimum: 0
        description: "Number of rotated backup files to keep. Default 5."
  client_listener:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean, default: true }
      host: { type: string, default: 127.0.0.1 }
      port: { type: integer, minimum: 1, maximum: 65535, default: 8023 }
      max_connections: { type: integer, minimum: 1, default: 100 }
      connection_timeout: { type: integer, minimum: 1, default: 30 }
  telnet_listener:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, bind_port, target]
      properties:
        name: { type: string }
        bind_host: { type: string, default: 0.0.0.0 }
        bind_port: { type: integer, minimum: 1, maximum: 65535 }
        target: { type: string }
        read_only: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        require_auth: { type: boolean, default: false }
        acl:
          type: array
          items: { type: string }
  ssh_listener:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, bind_port, target]
      properties:
        name: { type: string }
        bind_host: { type: string, default: 0.0.0.0 }
        bind_port: { type: integer, minimum: 1, maximum: 65535 }
        target: { type: string }
        read_only: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        require_auth: { type: boolean, default: true }
        acl:
          type: array
          items: { type: string }
  serial_ports:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, device]
      properties:
        name: { type: string }
        description: { type: string }
        device: { type: string }
        # PDU power feeds for this console: outlet refs <pdu>.<outlet id>.
        # Multiple = A/B dual feed. Unknown refs warn at startup; the console
        # shows not-powered (grey) until they resolve.
        power:
          type: array
          items: { type: string }
        baudrate: { type: integer, minimum: 1, default: 9600 }
        bytesize: { type: integer, enum: [5,6,7,8], default: 8 }
        parity: { type: string, enum: [N,E,O,M,S], default: N }
        stopbits: { oneOf: [ { type: integer, enum: [1,2] }, { type: number, enum: [1.5] } ], default: 1 }
        timeout: { type: number, minimum: 0, default: 1.0 }
        flow_control: { type: string, enum: [none, rtscts, dsrdtr, xonxoff], default: none }
        # Signal-line policy (issue #63): absent = "none" (line untouched);
        # legacy booleans are a shorthand (true = on, false = off).
        dtr:
          oneOf:
            - { type: boolean }
            - { type: string, enum: [none, on, off, presence-on, presence-off] }
        rts:
          oneOf:
            - { type: boolean }
            - { type: string, enum: [none, on, off, presence-on, presence-off] }
        # Write-slot capacity (issue #59): how many users may write at once.
        # Mode strings are preferred; legacy integers (0/1/>=2) are still
        # accepted during migration, mapped to none/one/multiple.
        max_read_write_users:
          oneOf:
            - { type: string, enum: [none, one, multiple] }
            - { type: integer, minimum: 0 }
          default: one
        # Per-port data-logging overrides (derived from the central logging
        # config / ports dir when omitted).
        log_file: { type: string }
        log_format: { type: string }
        log_line_template: { type: string }
        log_direction: { type: string }
        log_directions: { type: array, items: { type: string } }
        scrollback_size: { type: integer, minimum: 0, default: 0 }
        read_write_groups:
          type: array
          items: { type: string }
        read_only_groups:
          type: array
          items: { type: string }
  loopback_ports:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        buffer_size: { type: integer, minimum: 1, default: 1024 }
        # PDU power feeds for this console (see serial_ports.power).
        power:
          type: array
          items: { type: string }
        echo_delay: { type: number, minimum: 0, default: 0.0 }
        sanitize_control: { type: boolean, default: true }
        # Write-slot capacity (issue #59); default is 'one' (consistent with
        # serial and command). Legacy ints are accepted during migration
        # (0 -> none, 1 -> one, >= 2 -> multiple).
        max_read_write_users:
          oneOf:
            - { type: string, enum: [none, one, multiple] }
            - { type: integer, minimum: 0 }
          default: one
        scrollback_size: { type: integer, minimum: 0, default: 0 }
        read_write_groups:
          type: array
          items: { type: string }
        read_only_groups:
          type: array
          items: { type: string }
  # issue #67: the per-port surface is consolidated to these 15 keys. The
  # removed tuning keys (auto_restart, restart_delay, max_restarts,
  # restart_backoff, local_echo, pty_force_raw, pty_enter_mode, spawn_mode,
  # use_pty, output_crlf, clean_env, intercept_term_queries,
  # enable_output_batching, output_batch_size, output_batch_timeout,
  # output_force_flush_timeout, enable_batching, batch_size, batch_timeout);
  # always_buffer was removed later (issue #83: the relay queue is fed by
  # the federation hold refcount, and late federation viewers get history
  # from scrollback_size instead). All removed keys are rejected here
  # (additionalProperties: false); the live load path strips them with a
  # one-time warning per port (see
  # ConfigManager.load_config -> absorb_removed_command_port_keys). What
  # the first group toggled is now unconditional: sanitized environment,
  # XTGETTCAP interception, newline normalization (CRLF output, LF pipe
  # input), fixed I/O batching (1024 bytes / 2 ms), and no automatic
  # restart (press Enter in the console to respawn).
  command_ports:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, command]
      properties:
        name: { type: string }
        description: { type: string }
        command: { type: string }
        # PDU power feeds for this console (see serial_ports.power).
        power:
          type: array
          items: { type: string }
        shell: { type: boolean, default: false }
        cwd: { type: string }
        env: { type: object, additionalProperties: { type: string } }
        # Write-slot capacity (issue #59); legacy ints 0/1/>=2 map to none/one/multiple.
        max_read_write_users:
          oneOf:
            - { type: string, enum: [none, one, multiple] }
            - { type: integer, minimum: 0 }
          default: one
        # `interactive` is a shorthand preset that enables PTY plus
        # normalize_newlines; it never modifies the command string.
        interactive: { type: boolean }
        normalize_newlines: { type: boolean }
        # Process lifecycle: on-demand spawn on first client attach, plus
        # optional auto-stop after the last client leaves (0 = never stop).
        spawn_on_demand: { type: boolean, default: false }
        idle_timeout_sec: { type: number, minimum: 0, default: 0 }
        scrollback_size: { type: integer, minimum: 0, default: 0 }
        read_write_groups:
          type: array
          items: { type: string }
        read_only_groups:
          type: array
          items: { type: string }
  tcp_initiator_ports:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, host, port]
      properties:
        name: { type: string }
        description: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        # PDU power feeds for this console (see serial_ports.power).
        power:
          type: array
          items: { type: string }
        use_tls: { type: boolean, default: false }
        ssl_verify: { type: boolean, default: true }
        timeout: { type: number, minimum: 0, default: 10.0 }
        auto_reconnect: { type: boolean, default: true }
        reconnect_delay: { type: number, minimum: 0, default: 5.0 }
        # Write-slot capacity (issue #59/#60); default is 'one' (consistent with
        # serial, loopback, and command). Legacy ints are accepted during
        # migration (0 -> none, 1 -> one, >= 2 -> multiple).
        max_read_write_users:
          oneOf:
            - { type: string, enum: [none, one, multiple] }
            - { type: integer, minimum: 0 }
          default: one
        enable_batching: { type: boolean }
        batch_size: { type: integer, minimum: 1, default: 1024 }
        batch_timeout: { type: number, minimum: 0, default: 0.015 }
        enabled: { type: boolean, default: true }
        connect_on_demand: { type: boolean, default: false }
        disconnect_when_idle: { type: boolean, default: false }
        idle_disconnect_delay: { type: number, minimum: 0, default: 30.0 }
        protocol:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [plain, conserver, openmux]
              default: plain
            telnet_negotiation:
              type: string
              enum: [none, strip]
              default: none
            console_name: { type: string }
            username: { type: string }
            password: { type: string }
            remote_port: { type: string }
            api_key: { type: string }
        scrollback_size: { type: integer, minimum: 0, default: 0 }
        read_write_groups:
          type: array
          items: { type: string }
        read_only_groups:
          type: array
          items: { type: string }
  muxcon:
    type: object
    additionalProperties: false
    properties:
      # Retransmission timers in ms for the reliable transport. The runtime
      # defaults are 350 ms and 2000 ms.
      retx_initial_ms: { type: number, minimum: 0, default: 350 }
      retx_max_ms: { type: number, minimum: 0, default: 2000 }
      auth_required: { type: boolean, default: true }
      federated_cache_enabled: { type: boolean }
      federated_cache_ttl_sec: { type: number, minimum: 0 }
      heartbeat_interval: { type: number, minimum: 0 }
      shutdown_grace_timeout_sec: { type: number, minimum: 0 }
      context_idle_timeout_sec: { type: number, minimum: 0 }
      shutdown_ack_flush_ms: { type: integer, minimum: 0 }
      mpath_primary_stale_sec: { type: number, minimum: 0 }
      mpath_failover_check_sec: { type: number, minimum: 0 }
      mpath_strategy: { type: string, enum: [best_pref] }
      mpath_preemptive_promote: { type: boolean }
      mpath_neighbor_idle_drop_sec: { type: number, minimum: 0 }
      auth:
        type: object
        additionalProperties: false
        description: >
          Ed25519 client authentication (nested form). The flat top-level keys
          auth_key_id and auth_private_key are equivalent and also accepted.
        properties:
          required: { type: boolean }
          private_key: { type: string }
          private_key_path: { type: string }
          key_id: { type: string }
      auth_key_id: { type: string }
      auth_private_key: { type: string }
      auth_private_key_path: { type: string }
      listeners:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean, default: true }
            interface: { type: string }
            # Legacy aliases read when the primary key is absent
            # (muxcon.py _normalize_listener_conf).
            bind_interface: { type: string }
            routing_mark: { type: integer }
            so_mark: { type: integer }
            host: { type: string, default: "0.0.0.0" }
            port: { type: integer, minimum: 1, maximum: 65535, default: 7822 }
            use_tls: { type: boolean, default: true }
            tls_autogen: { type: boolean, default: true }
            ssl_cert: { type: string }
            ssl_key: { type: string }
            ssl_ca_cert: { type: string }
            require_client_cert: { type: boolean, default: false }
            path_pref: { type: integer }
            path_group: { type: string }
            tags: { type: object, additionalProperties: true }
            fwmark: { type: integer }
        uniqueItems: true
      initiators:
        # Outbound federation peers. Known options are typed below with their
        # runtime defaults; any other key is passed through to the adapter, so
        # items intentionally stay open (additionalProperties: true).
        type: array
        items:
          type: object
          additionalProperties: true
          required: [host, port]
          properties:
            host: { type: string }
            port: { type: integer, minimum: 1, maximum: 65535, default: 7822 }
            use_tls: { type: boolean, default: true }
            ssl_verify: { type: boolean, default: true }
            tls_tofu: { type: boolean, default: true }
            tls_pin_fingerprint: { type: string }
            ssl_ca_cert: { type: string }
            ssl_cert: { type: string }
            ssl_key: { type: string }
            server_hostname: { type: string }
            bind_host: { type: string }
            bind_port: { type: integer, minimum: 0 }
            interface: { type: string }
            fwmark: { type: integer }
            path_pref: { type: integer }
            retry_backoff_initial: { type: number, minimum: 0 }
            retry_backoff_max: { type: number, minimum: 0 }
            retry_short_session_sec: { type: number, minimum: 0 }
        uniqueItems: true
      public_keys:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [key_id, public_key]
          properties:
            key_id: { type: string }
            public_key: { type: string }
            # Per-key federation filters (muxcon.py), applied once a
            # connection authenticates with that key.
            advertise_filters: { $ref: "#/$defs/filter_set" }
            accept_filters: { $ref: "#/$defs/filter_set" }
      # Adapter-level federation filters: the default for every muxcon
      # connection. A per-key filter on public_keys[] overrides these once a
      # connection authenticates with that key.
      advertise_filters: { $ref: "#/$defs/filter_set" }
      accept_filters: { $ref: "#/$defs/filter_set" }
  web_console:
    type: object
    additionalProperties: false
    properties:
      host: { type: string, default: "0.0.0.0" }
      port: { type: integer, minimum: 1, maximum: 65535, default: 8081 }
      ssl_port: { type: integer, minimum: 1, maximum: 65535, default: 8443 }
      base_path: { type: string, default: / }
      enable_ui: { type: boolean, default: true }
      motd: { type: string, description: "Public message of the day shown on the login page. Multiline text is supported; blank hides it." }
      logged_in_motd: { type: string, description: "Message of the day for logged-in users, shown at the top of the status page. May hold sensitive text; never shown before login. Multiline; blank hides it." }
      # X-Forwarded-Prefix handling for URL generation; the runtime defaults
      # this to true, which the schema previously omitted.
      respect_forwarded_prefix: { type: boolean, default: true }
      enable_probes: { type: boolean, default: true }
      probes_include_details: { type: boolean, default: false }
      use_tls: { type: boolean, default: false }
      tls_autogen: { type: boolean, default: true }
      ssl_cert: { type: string }
      ssl_key: { type: string }
      # Session cookie lifetime in seconds; the runtime defaults to 8 hours.
      session_ttl_seconds: { type: integer, minimum: 0, default: 28800 }
      hardware_info_file: { type: string, default: /etc/openmux-hardware }
      # SSO trust header (federated proxy): v1 uses a shared secret, v1e a
      # registered MuxCon public key. All optional; sso_secret gates trust.
      sso_trust_header: { type: string, default: X-OMX-SSO }
      sso_secret: { type: string }
      sso_max_skew_sec: { type: integer, minimum: 0, default: 120 }
      plugins:
        type: array
        items:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
              anyOf:
                - required: [module]
                - required: [name]
              properties:
                module: { type: string }
                name: { type: string }
                enabled: { type: boolean, default: true }
  web_status:
    type: object
    additionalProperties: false
    properties:
      host: { type: string, default: "0.0.0.0" }
      port: { type: integer, minimum: 1, maximum: 65535, default: 8080 }
      enable_http_api: { type: boolean, default: true }
      cors_enable: { type: boolean, default: true }
      enable_fault_injection: { type: boolean, default: false }
  port_actions:
    type: object
    additionalProperties: false
    properties:
      actions_dir:
        oneOf:
          - { type: string }
          # An empty list is accepted (it means "no extra action dirs"), so no
          # minItems constraint here.
          - { type: array, items: { type: string } }
      action_ports:
        type: object
        additionalProperties:
          type: array
          items: { type: string }
  # PDU power management. Outlets are discovered from the device via the
  # driver; config only carries optional per-outlet annotations. Console
  # ports declare their own feeds via the per-port `power` key. Outlet ids
  # are opaque device strings (e.g. "1", "A1" on 3-phase units); refs are
  # <pdu name>.<outlet id>, so pdu name and id must not contain dots or
  # whitespace.
  power:
    type: object
    additionalProperties: false
    properties:
      enabled: { type: boolean, default: true }
      pdus:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, driver]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
            description: { type: string }
            # Driver registry key (built-in: "dummy"). Real drivers take
            # their connection settings in `options` below.
            driver: { type: string }
            # Per-PDU poll cadence in seconds; 0 = on-demand reads only.
            # Default 10 (see pdu.py DEFAULT_POLL_INTERVAL).
            poll_interval: { type: number, minimum: 0, default: 10 }
            # Free-form, driver-specific settings.
            options: { type: object }
            outlets:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, pattern: '^[^.\\s]+$' }
                  description: { type: string }

  # Fallback for the fail-fast switch, read only when server.
  # fail_fast_adapters is absent (adapters/factory.py checks top-level as a
  # fallback). The server section value takes precedence.
  fail_fast_adapters: { type: boolean, default: true }

anyOf:
  - required: [client_listener]
  - required: [serial_ports]
  - required: [loopback_ports]
  - required: [command_ports]
  - required: [tcp_initiator_ports]
  - required: [muxcon]
  - required: [web_console]
  - required: [web_status]
  - required: [power]
$defs:
  # One muxcon filter set, used by a single advertise/accept direction. Each
  # key pair is include/exclude over ONE port attribute; a port passes only
  # if it satisfies all three dimensions. An empty or missing list means "no
  # constraint on this dimension". Exclude patterns always win. Patterns are
  # case-sensitive globs (fnmatch), e.g. "console_*".
  #
  # Default-deny (ticket #77): if ALL include lists in one direction are
  # empty, that direction matches no port. Set include: ["*"] to share or
  # accept everything.
  #
  # Key pair            Matches against
  # include/exclude     the port NAME
  # adapter_*           the port's adapter TYPE (serial, loopback, command, ...)
  # server_*            the origin server ID (which peer federation sent it)
  filter_set:
    type: object
    additionalProperties: false
    properties:
      include: { type: array, items: { type: string } }
      exclude: { type: array, items: { type: string } }
      adapter_include: { type: array, items: { type: string } }
      adapter_exclude: { type: array, items: { type: string } }
      server_include: { type: array, items: { type: string } }
      server_exclude: { type: array, items: { type: string } }
